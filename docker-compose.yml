services:
  mysql:
    image: mysql:8.0
    container_name: sensory-nav-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_pw
      MYSQL_DATABASE: sensory_nav
      MYSQL_USER: sensory
      MYSQL_PASSWORD: sensory_pw
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_pw"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mysql_data:
